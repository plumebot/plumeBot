# PlumeBot 默认配置模板（嵌入二进制）。
# 当运行目录下不存在 config.yaml 时，由 config.Load 写入此内容作为初始配置。
# 字段空值/缺省的兜底由各消费包自行处理（logger、onebot、service/event、infra/ai 等）。

bot:
  name: PlumeBot
  self_id: ""              # bot 自身 QQ 号；可用环境变量 PLUMEBOT_SELFID 覆盖

onebot:
  ws_url: ws://127.0.0.1:3001   # NapCat「WebSocket 服务器」地址（正向 WS）
  access_token: ""              # NapCat 若设置了访问令牌则填写

log:
  level: info              # debug | info | warn | error

control:
  mode: mention            # mention | auto
  state:                   # 状态规则参数全局默认值（P5-002，架构 §9.2）；0/空 = 用代码默认
    energy_max: 100        # 精力上限
    energy_cost: 10        # 每次回复消耗
    energy_recover: 5      # 精力恢复（点/分钟）
    energy_threshold: 20   # 低于此值不主动说话（@ 除外）
    cooldown_seconds: 60   # 两次主动回复最小间隔（秒）
    consecutive_limit: 5   # 连续回复上限
    rest_seconds: 300      # 连续达上限强制休息时长（秒）
    quiet_hours_start: "23:00"  # 深夜静默起 "HH:MM"
    quiet_hours_end: "07:00"    # 深夜静默止 "HH:MM"（跨午夜）
    short_message_chars: 4 # 短消息忽略阈值（<N 字不触发）

middleware:
  rate_limit:
    rate: 2                # 令牌补充速率（个/秒）
    burst: 20              # 桶容量，允许的突发消息数
    max_wait_seconds: 10   # 等待令牌上限（秒），超时后回复固定消息并丢弃
  sensitive_words: []      # 敏感词表；命中后回复「我拒绝回答」并丢弃，空数组 = 不过滤

llm:
  timeout_seconds: 60           # 单次 LLM 调用超时（秒）；≤0 → 60
  native_multimodal: false      # 原生多模态模式（阶段3）；默认关，占位
  models:                       # 模型条目数组；条目内 provider 为工厂选择键
    - name: chat                # 用户取名；chat_model 引用
      provider: openai          # 供应商：openai（OpenAI 兼容接口）；空 → openai
      base_url: https://api.deepseek.com/v1   # OpenAI 兼容端点；空 → https://api.openai.com/v1
      api_key: ""               # API Key；本地模型（如 Ollama）可留空；可用环境变量 PLUMEBOT_APIKEY_<模型名大写> 覆盖（如 name=chat → PLUMEBOT_APIKEY_CHAT）
      model: deepseek-chat      # 模型名；空 → 启动报错（不可猜测）
      # temperature: 0.7        # 采样温度；缺省 → 不传（使用模型默认）
      max_tokens: 0             # 最大输出 token 数；≤0 → 不传
    # - name: vision            # 图片描述模型条目；启用视觉时在两处 yaml 同时添加并设 vision_model
    #   provider: openai
    #   base_url: ...
    #   api_key: ""
    #   model: qwen-vl-plus
  chat_model: chat              # 对话模型条目引用；空 → models[0]
  vision_model: ""              # 图片描述模型条目引用；空 = 描述关闭
  prompt:                       # prompt 组装预算/上限（P6-001，架构 §6）
    facts_per_member: 3         # 窗口内每成员事实条数上限；≤0 → 3
    jargon_cap: 20              # confirmed 黑话条数上限；≤0 → 20
    describe_recent_rounds: 5   # 只描述窗口最近 N 轮消息的图片；≤0 → 5
    describe_per_turn_cap: 10   # 每条消息图片描述条数上限；≤0 → 10

tools:
  enabled: [store_fact, learn_jargon, forget_fact]   # 启用的工具名列表（P3-004 记忆更新工具）；空 = 不注册任何工具

agent:
  name: PlumeBot              # agent 标识（adk 元数据，multi-agent 路由用）；空 → PlumeBot
  description: ""             # 能力描述（adk 元数据）；空 → 默认描述
  system_prompt: "你是mifi，你需要尽可能伪装成人类，不可以用机器人的口语回答，回答简洁犀利如:\nA:你个人机 你:和一位，你个入\nA:我喜欢你 你：我也喜欢你"
